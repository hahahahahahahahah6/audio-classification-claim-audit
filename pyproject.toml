[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-classification-claim-audit"
version = "0.1.0"
description = "Offline deterministic documentation claim auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Project contributors"}]
dependencies = []

[project.scripts]
audio-classification-claim-audit = "audio_classification_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["audio_classification_claim_audit*"]
